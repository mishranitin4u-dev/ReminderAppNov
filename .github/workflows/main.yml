
      - name: Enable and verify core library desugaring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")
          if not p.exists():
              p = Path("android/app/build.gradle")

          if not p.exists():
              raise SystemExit("ERROR: Android Gradle file not found")

          s = p.read_text()

          if p.suffix == ".kts":
              enabled = "isCoreLibraryDesugaringEnabled = true"
              dependency = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          else:
              enabled = "coreLibraryDesugaringEnabled true"
              dependency = "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"

          if enabled not in s:
              if "compileOptions {" not in s:
                  raise SystemExit("ERROR: compileOptions block not found")
              s = s.replace(
                  "compileOptions {",
                  "compileOptions {\n        " + enabled,
                  1
              )

          if dependency not in s:
              if "dependencies {" in s:
                  s = s.replace(
                      "dependencies {",
                      "dependencies {\n    " + dependency,
                      1
                  )
              else:
                  s += "\ndependencies {\n    " + dependency + "\n}\n"

          p.write_text(s)

          print("SUCCESS: Desugaring enabled")
          print("SUCCESS: Dependency added")
          print("Gradle file:", p)
          PY
